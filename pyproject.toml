[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landed"
version = "0.1.0"
description = "Quotation normalization and landed-cost intelligence for manufacturing sourcing"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["landed*"]

# The ASGI app does not sit in a location Vercel probes by default, because the web
# layer is one adapter over `landed.core` rather than the root of the project.
[tool.vercel]
entrypoint = "landed.web.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: performs a real network call to a model provider (billed, non-deterministic)",
]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as call expressions in parameter defaults. That is
# the framework's required idiom, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
